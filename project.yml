name: Faceless

options:
  bundleIdPrefix: com.faceless
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios.git
    majorVersion: 4.0.0

targets:
  Faceless:
    type: application
    platform: iOS
    sources:
      - path: Faceless
    settings:
      base:
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Faceless/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.faceless.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        DEVELOPMENT_TEAM: "ZS89AATCJ2"
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: Firebase
        product: FirebaseStorage
      - package: Lottie
        product: Lottie
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: QuartzCore.framework
    scheme:
      testTargets:
        - FacelessTests
      gatherCoverageData: true
      environmentVariables:
        - variable: IDEPreferLogStreaming
          value: "YES"
          isEnabled: true

  FacelessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FacelessTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Faceless

schemes:
  Faceless:
    build:
      targets:
        Faceless: all
        FacelessTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - FacelessTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
